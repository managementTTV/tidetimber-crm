    function iwHtml(l) {
      const reasons = AREA_REASONS.filter(r => l.areaReasons && l.areaReasons[r.key]).map(r => r.label);
      const verd = l.areaVerdict ? (AREA_VERDICTS.find(v => v.key === l.areaVerdict) || {}).label : '';
      return `<div class="dl-iw">
        <div class="iw-addr">${escapeHtml(l.address || 'Untitled')}${copyAddrBtn(l.address)}</div>
        <div class="iw-sub">${escapeHtml(l.dealId)} · ${escapeHtml(l.status)}</div>
        <div class="iw-row">ARV ${fmtMoney(l.arv)} · Offer ${fmtMoney(l.offer)}</div>
        ${verd ? `<div class="iw-row">Area read: <strong>${escapeHtml(verd)}</strong></div>` : ''}
        ${l.dealOutcome ? `<div class="iw-row">Outcome: <strong>${escapeHtml(dealOutcomeLabel(l.dealOutcome))}</strong></div>` : ''}
        ${reasons.length ? `<div class="iw-reasons">⚑ ${reasons.map(escapeHtml).join(', ')}</div>` : ''}
        ${dealReasonCount(l) ? `<div class="iw-row" style="color:#46586A; font-size:11px;">Deal-specific: ${DEAL_REASONS.filter(r => l.dealReasons && l.dealReasons[r.key]).map(r => escapeHtml(r.label)).join(', ')}</div>` : ''}
        ${l.notes ? `<div class="iw-row" style="color:#46586A;">${escapeHtml(l.notes.slice(0, 120))}${l.notes.length > 120 ? '…' : ''}</div>` : ''}
        <button class="iw-open" data-openid="${l.id}">Open record →</button>
      </div>`;
    }

    // #2: which plotted leads are currently shown (all, or those matching the search).
    function visibleMapped() {
      const q = mapQuery.trim().toLowerCase();
      return q ? mapped.filter(l => (l.address || '').toLowerCase().includes(q)) : mapped;
    }
    function buildMarkers() {
      markers.forEach(m => m.setMap(null));
      markers = [];
      visibleMapped().forEach(l => {
        const marker = new google.maps.Marker({
          position: { lat: l.lat, lng: l.lng }, map, title: l.address || '',
          icon: { path: google.maps.SymbolPath.CIRCLE, scale: 7, fillColor: pinColor(l), fillOpacity: 0.95, strokeColor: '#1C2B39', strokeWeight: 1 },
        });
        marker.addListener('click', () => {
          info.setContent(iwHtml(l));
          info.open(map, marker);
          google.maps.event.addListenerOnce(info, 'domready', () => {
            const btn = document.querySelector('.iw-open[data-openid="' + l.id + '"]');
            if (btn) btn.addEventListener('click', () => { closeOverlay(); openDetail(l.id); });
          });
        });
        markers.push(marker);
      });
    }

    function buildHeat() {
      if (heat) { heat.setMap(null); heat = null; }
      if (!mapHeatOn) return;
      // Heat is a LOCATION signal. A lead contributes only when someone made an
      // explicit "avoid" call on the area. Records that carry notes but no area
      // verdict -- deal-specific passes -- stay off the heatmap entirely, so a
      // narrow lot or a bad price never paints a street red.
      const pts = visibleMapped()
        .filter(l => l.areaVerdict === 'avoid')
        .map(l => ({
          location: new google.maps.LatLng(l.lat, l.lng),
          weight: 3 + areaReasonCount(l)
        }));
      if (!pts.length) return;
      heat = new google.maps.visualization.HeatmapLayer({ data: pts, radius: 35, opacity: 0.7, map });
    }

    function renderLegend() {
      const el = document.getElementById('dl-map-legend');
      if (mapColorMode === 'verdict') {
        el.innerHTML = AREA_VERDICTS.map(v => `<span class="lg"><span class="dot" style="background:${v.color};"></span>${v.label}</span>`).join('')
          + `<span class="lg"><span class="dot" style="background:#B6AA90;"></span>No read</span>`;
      } else {
        const present = [...new Set(visibleMapped().map(l => l.status))];
        el.innerHTML = present.map(s => `<span class="lg"><span class="dot" style="background:${STATUS_COLOR[s] || '#6B6459'};"></span>${escapeHtml(s)}</span>`).join('');
      }
      if (mapHeatOn) el.innerHTML += `<span class="lg"><span class="dot" style="background:linear-gradient(90deg,#3F6B4F,#B8863B,#8B4A3D);"></span>Heatmap = caution density</span>`;
    }

    buildMarkers();
    buildHeat();
    renderLegend();

    overlay.querySelectorAll('#dl-map-colormode button').forEach(b => {
      b.addEventListener('click', () => {
        mapColorMode = b.dataset.mode;
        overlay.querySelectorAll('#dl-map-colormode button').forEach(x => x.classList.toggle('active', x.dataset.mode === mapColorMode));
        buildMarkers(); renderLegend();
      });
    });
    document.getElementById('dl-map-heat').addEventListener('click', () => {
      mapHeatOn = !mapHeatOn;
      document.getElementById('dl-map-heat').textContent = mapHeatOn ? '🔥 Heatmap: On' : '🔥 Heatmap: Off';
      buildHeat(); renderLegend();
    });

    // #2: raw address search — filters the pins as you type and pans/zooms to fit matches.
    const mapSearchEl = document.getElementById('dl-map-search');
    if (mapSearchEl) {
      mapSearchEl.addEventListener('input', () => {
        mapQuery = mapSearchEl.value;
        buildMarkers(); buildHeat(); renderLegend();
        if (mapQuery.trim()) {
          const vis = visibleMapped();
          if (vis.length) {
            const b = new google.maps.LatLngBounds();
            vis.forEach(l => b.extend({ lat: l.lat, lng: l.lng }));
            map.fitBounds(b);
            if (vis.length === 1) map.setZoom(Math.min(map.getZoom() || 14, 15));
          }
        }
      });
    }
  }

  // --- Map data export for Google My Maps (Pat request) --------------------
  // Google My Maps imports CSV (it uses the Latitude/Longitude columns) and KML
  // (which also carries the per-status pin colors). Both files are built from the
  // pins currently visible on the Deal Map.
  function downloadFile(filename, mime, text) {
    const blob = new Blob([text], { type: mime + ';charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function areaVerdictLabel(k) {
    const v = AREA_VERDICTS.find(x => x.key === (k || ''));
    return v ? v.label : '';
  }
  function areaFlagLabels(l) {
    return AREA_REASONS.filter(r => l.areaReasons && l.areaReasons[r.key]).map(r => r.label).join('; ');
  }
  function mapExportName(ext) {
    return 'ttv-deal-map-' + new Date().toISOString().slice(0, 10) + '.' + ext;
  }
  function exportMapCSV(list, unmappedCount) {
    if (!list || !list.length) { toast('No plotted leads to export'); return; }
    const cols = ['Name', 'Address', 'Latitude', 'Longitude', 'Status', 'Area read',
      'Area flags', 'Deal outcome', 'ARV', 'Offer', 'Follow-up', 'Deal ID', 'Notes'];
    const escCsv = (v) => {
      const t = v === null || v === undefined ? '' : String(v);
      return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    };
    const rows = [cols.join(',')];
    list.forEach(l => {
      rows.push([
        l.address || 'Untitled',
        l.address || '',
        l.lat, l.lng,
        l.status || '',
        areaVerdictLabel(l.areaVerdict),
        areaFlagLabels(l),
        l.dealOutcome ? dealOutcomeLabel(l.dealOutcome) : '',
        l.arv || '', l.offer || '',
        l.followUpDate || '',
        l.dealId || '',
        (l.notes || '').replace(/\s+/g, ' ').slice(0, 300),
      ].map(escCsv).join(','));
    });
    downloadFile(mapExportName('csv'), 'text/csv', rows.join('\n'));
    toast('Exported ' + list.length + ' pin(s)' + (unmappedCount ? ' \u2014 ' + unmappedCount + ' lead(s) still need geocoding' : ''));
  }
  // KML color is aabbggrr, not #rrggbb.
  function kmlColor(hex) {
    const h = String(hex || '#6B6459').replace('#', '').toLowerCase();
    if (h.length !== 6) return 'ff59646b';
    return 'ff' + h.slice(4, 6) + h.slice(2, 4) + h.slice(0, 2);
  }
  function exportMapKML(list, unmappedCount) {
    if (!list || !list.length) { toast('No plotted leads to export'); return; }
    const styleId = (st) => 'st-' + String(st || 'none').toLowerCase().replace(/[^a-z0-9]+/g, '-');
    const statuses = [...new Set(list.map(l => l.status || 'Unknown'))];
    let kml = '<?xml version="1.0" encoding="UTF-8"?>\n'
      + '<kml xmlns="http://www.opengis.net/kml/2.2"><Document>\n'
      + '<name>Tide &amp; Timber Deal Map ' + new Date().toISOString().slice(0, 10) + '</name>\n';
    statuses.forEach(st => {
      kml += '<Style id="' + styleId(st) + '"><IconStyle><color>' + kmlColor(STATUS_COLOR[st])
        + '</color><scale>1.1</scale><Icon><href>http://maps.google.com/mapfiles/kml/paddle/wht-circle.png</href></Icon></IconStyle></Style>\n';
    });
    list.forEach(l => {
      const fields = [
        ['Deal ID', l.dealId || ''],
        ['Status', l.status || ''],
        ['Area read', areaVerdictLabel(l.areaVerdict)],
        ['Area flags', areaFlagLabels(l)],
        ['Deal outcome', l.dealOutcome ? dealOutcomeLabel(l.dealOutcome) : ''],
        ['ARV', l.arv || ''],
        ['Offer', l.offer || ''],
        ['Follow-up', l.followUpDate || ''],
        ['Notes', (l.notes || '').replace(/\s+/g, ' ').slice(0, 300)],
      ].filter(f => f[1] !== '' && f[1] !== null);
      kml += '<Placemark><name>' + escapeHtml(l.address || 'Untitled') + '</name>'
        + '<styleUrl>#' + styleId(l.status) + '</styleUrl>'
        + '<description>' + escapeHtml(fields.map(f => f[0] + ': ' + f[1]).join(' | ')) + '</description>'
        + '<ExtendedData>'
        + fields.map(f => '<Data name="' + escapeHtml(f[0]) + '"><value>' + escapeHtml(String(f[1])) + '</value></Data>').join('')
        + '</ExtendedData>'
        + '<Point><coordinates>' + l.lng + ',' + l.lat + ',0</coordinates></Point></Placemark>\n';
    });
    kml += '</Document></kml>\n';
    downloadFile(mapExportName('kml'), 'application/vnd.google-earth.kml+xml', kml);
    toast('Exported ' + list.length + ' pin(s)' + (unmappedCount ? ' \u2014 ' + unmappedCount + ' lead(s) still need geocoding' : ''));
  }

  // =====================================================================
  //  DUPLICATE REPORT + MERGE
  //  The in-form warning stops a human from typing a duplicate. This is the
  //  other half: it finds duplicates that are ALREADY in the ledger (all of
  //  the existing ones came from the July bulk import, which wrote without a
  //  duplicate check) and merges a pair in one click.
  //
  //  Merge policy -- deliberate, because the two halves of every real pair
  //  hold DIFFERENT things:
  //    * KEEPER  = the record with the fuller address. It carries the live
  //      pipeline state (status, follow-up track/stage/date, contact).
  //    * TWIN    = usually the imported record. It carries the underwriting
  //      history (Adam/Pat notes, area read, decided-by, deal outcome).
  //  So the merge pulls the twin's history INTO the keeper, fills any blank
  //  keeper field from the twin, ORs the checkbox sets, and never overwrites
  //  a value the keeper already has. Status and follow-up scheduling always
  //  stay the keeper's.
  //
  //  Nothing is deleted. The twin is marked retired and dropped out of the
  //  follow-up queues, so it can never be worked again -- deleting the row
  //  stays a human decision.
  // =====================================================================
  const MERGE_FILL_IF_BLANK = ['contactName','contactEmail','arv','rehab','offer','offerSentDate',
    'dealOutcome','areaVerdict','decidedBy','decidedOn','participants','recordType'];

  function mergeLeadPair(keeper, twin) {
    const today = new Date().toISOString().slice(0, 10);

    MERGE_FILL_IF_BLANK.forEach(f => {
      const kv = keeper[f];
      if ((kv === '' || kv === null || kv === undefined) && twin[f]) keeper[f] = twin[f];
    });
    // A specific offer type beats the default.
    if ((!keeper.offerType || keeper.offerType === 'WS Basic') && twin.offerType && twin.offerType !== 'WS Basic') {
      keeper.offerType = twin.offerType;
    }
    keeper.isNewDev = !!(keeper.isNewDev || twin.isNewDev);
    keeper.isFixFlip = !!(keeper.isFixFlip || twin.isFixFlip);
    keeper.areaReasons = keeper.areaReasons || {};
    keeper.dealReasons = keeper.dealReasons || {};
    AREA_REASONS.forEach(r => { if (twin.areaReasons && twin.areaReasons[r.key]) keeper.areaReasons[r.key] = true; });
    DEAL_REASONS.forEach(r => { if (twin.dealReasons && twin.dealReasons[r.key]) keeper.dealReasons[r.key] = true; });
    if (keeper.lat == null && twin.lat != null) { keeper.lat = twin.lat; keeper.lng = twin.lng; }
    if (twin.dd && Object.keys(twin.dd).length) keeper.dd = Object.assign({}, twin.dd, keeper.dd || {});

    const twinNotes = (twin.notes || '').trim();
    if (twinNotes) {
      keeper.notes = (keeper.notes ? keeper.notes.trim() + '\n\n' : '')
        + '--- merged from ' + (twin.dealId || twin.id) + ' (' + (twin.address || '') + ') on ' + today + ' ---\n'
        + twinNotes;
    }
    if (twin.status && twin.status !== keeper.status) {
      keeper.notes = (keeper.notes ? keeper.notes.trim() + '\n' : '')
        + '[merge note] retired twin was marked "' + twin.status + '".';
    }
    keeper.addrKey = addrKey(keeper.address);
    keeper.lastUpdated = today;

    twin.retiredAsDuplicateOf = keeper.dealId || keeper.id;
    twin.followUpDate = '';            // drops it out of Today's Follow-Ups and Past Due
    twin.addrKey = addrKey(twin.address);
    twin.lastUpdated = today;
    twin.notes = 'RETIRED DUPLICATE -- merged into ' + (keeper.dealId || keeper.id) + ' on ' + today
      + '. Safe to delete.\n' + (twin.notes || '');
    return { keeper, twin };
  }

  // Clusters across the whole ledger. kind: 'exact' | 'near'.
  function findDuplicatePairs() {
    const live = leads.filter(l => l.address && !l.retiredAsDuplicateOf);
    const pairs = [];
    for (let i = 0; i < live.length; i++) {
      for (let j = i + 1; j < live.length; j++) {
        const a = live[i], b = live[j];
        const ka = a.addrKey || addrKey(a.address), kb = b.addrKey || addrKey(b.address);
        if (!ka || !kb) continue;
        if (ka === kb) { pairs.push({ kind: 'exact', a, b, score: 1 }); continue; }
        const score = addrOverlap(a.address, b.address);
        const sameNum = addrHouseNum(a.address) && addrHouseNum(a.address) === addrHouseNum(b.address);
        const contains = ka.length > 5 && kb.length > 5 && (ka.indexOf(kb) === 0 || kb.indexOf(ka) === 0);
        // A near pair must be the SAME house number -- 7413 and 7419 on one
        // street are two different properties, not a duplicate.
        if (sameNum && (contains || score >= 0.5)) pairs.push({ kind: 'near', a, b, score });
      }
    }
    return pairs.sort((x, y) => (x.kind === y.kind ? y.score - x.score : (x.kind === 'exact' ? -1 : 1)));
  }

  function recCardHtml(l, isKeeper) {
    const notes = (l.notes || '').replace(/\s+/g, ' ').slice(0, 140);
    return `<div class="dl-dupe-rec ${isKeeper ? 'is-keeper' : ''}">
      <div class="rec-addr">${escapeHtml(l.address || '')}${isKeeper ? ' &nbsp;<span class="pair-kind">keeper</span>' : ''}</div>
      <div class="rec-meta">${escapeHtml(l.dealId || l.id)} &middot; ${escapeHtml(l.status || '')}
        ${l.followUpDate ? '&middot; follow-up ' + fmtDate(l.followUpDate) : '&middot; no follow-up date'}
        ${l.contactName ? '&middot; ' + escapeHtml(l.contactName) : ''}
        ${l.decidedBy ? '&middot; decided by ' + escapeHtml(l.decidedBy) : ''}
        ${l.dateAdded ? '&middot; added ' + fmtDate(l.dateAdded) : ''}</div>
      ${notes ? `<div class="rec-meta">&ldquo;${escapeHtml(notes)}${(l.notes || '').length > 140 ? '\u2026' : ''}&rdquo;</div>` : ''}
    </div>`;
  }

  function openDupesModal() {
    const pairs = findDuplicatePairs();
    const missingKeys = leads.filter(l => l.address && !l.addrKey).length;

    const overlay = document.createElement('div');
    overlay.className = 'dl-overlay';
    overlay.innerHTML = `
      <div class="dl-modal dl-dupe-modal">
        <h2>Duplicate records</h2>
        <div class="subid">${pairs.length} pair(s) found across ${leads.filter(l => l.address).length} leads
          &middot; exact = same address after normalizing &middot; near = same house number and street</div>
        <div class="dl-detail-body" id="dl-dupe-body">
          ${pairs.length ? pairs.map((pr, i) => {
            // Keeper defaults to the fuller address; that record holds the live
            // pipeline state in every case we have seen.
            const keeperFirst = (pr.a.address || '').length >= (pr.b.address || '').length;
            const keeper = keeperFirst ? pr.a : pr.b;
            const twin = keeperFirst ? pr.b : pr.a;
            return `<div class="dl-dupe-pair" data-pair="${i}">
              <div class="pair-head">
                <span class="pair-kind">${pr.kind === 'exact' ? 'Exact match' : 'Near match \u00b7 ' + Math.round(pr.score * 100) + '%'}</span>
                <span class="pair-kind">${escapeHtml(keeper.dealId || '')} &larr; ${escapeHtml(twin.dealId || '')}</span>
              </div>
              ${recCardHtml(keeper, true)}
              ${recCardHtml(twin, false)}
              <div class="dl-dupe-actions">
                <button class="dl-btn dl-btn-primary dl-btn-sm" data-merge="${i}" data-keeper="${keeper.id}" data-twin="${twin.id}">Merge into keeper</button>
                <button class="dl-btn dl-btn-ghost dl-btn-sm" data-swap="${i}">Swap keeper</button>
                <button class="dl-btn dl-btn-ghost dl-btn-sm" data-open="${keeper.id}">Open keeper</button>
                <button class="dl-btn dl-btn-ghost dl-btn-sm" data-open="${twin.id}">Open twin</button>
              </div>
              <div class="dl-dupe-note">Merge pulls the twin's notes, area read, decision and any blank field into the keeper. The keeper's status and follow-up schedule are untouched. The twin is marked retired and drops out of the follow-up queues \u2014 it is never deleted.</div>
            </div>`;
          }).join('') : '<div class="dl-dash-empty">No duplicates found. Nice.</div>'}
        </div>
        <div class="dl-modal-actions">
          <button class="dl-btn dl-btn-ghost" id="dl-dupe-close">Close</button>
          ${missingKeys ? `<button class="dl-btn dl-btn-ghost" id="dl-dupe-keys">Save address keys (${missingKeys})</button>` : ''}
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeOverlay(); });
    document.getElementById('dl-dupe-close').addEventListener('click', closeOverlay);

    // Swap which record is treated as the keeper, then re-render the report.
    overlay.querySelectorAll('[data-swap]').forEach(btn => {
      btn.addEventListener('click', () => {
        const box = btn.closest('.dl-dupe-pair');
        const mergeBtn = box.querySelector('[data-merge]');
        const k = mergeBtn.dataset.keeper, t = mergeBtn.dataset.twin;
        mergeBtn.dataset.keeper = t; mergeBtn.dataset.twin = k;
        const recs = box.querySelectorAll('.dl-dupe-rec');
        recs[0].classList.toggle('is-keeper');
        recs[1].classList.toggle('is-keeper');
        toast('Keeper swapped \u2014 keeping ' + ((leads.find(l => l.id === t) || {}).dealId || ''));
      });
    });

    overlay.querySelectorAll('[data-open]').forEach(btn => {
      btn.addEventListener('click', () => { closeOverlay(); openDetail(btn.dataset.open); });
    });

    overlay.querySelectorAll('[data-merge]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const keeper = leads.find(l => l.id === btn.dataset.keeper);
        const twin = leads.find(l => l.id === btn.dataset.twin);
        if (!keeper || !twin) { toast('Record not found \u2014 reopen the report'); return; }
        if (!confirm('Merge ' + (twin.dealId || '') + ' into ' + (keeper.dealId || '') + '?\n\n'
          + 'The twin keeps existing but is marked retired and loses its follow-up date. Nothing is deleted.')) return;
        btn.disabled = true;
        btn.textContent = 'Merging\u2026';
        mergeLeadPair(keeper, twin);
        const okA = await upsertLead(keeper);
        const okB = await upsertLead(twin);
        render();
        if (okA && okB) {
          const box = btn.closest('.dl-dupe-pair');
          box.style.opacity = '0.5';
          btn.textContent = 'Merged \u2713';
          toast('Merged into ' + (keeper.dealId || ''));
        } else {
          btn.disabled = false;
          btn.textContent = 'Merge into keeper';
          toast('Sync failed \u2014 check your connection and try again');
        }
      });
    });

    const keysBtn = document.getElementById('dl-dupe-keys');
    if (keysBtn) {
      keysBtn.addEventListener('click', async () => {
        const todo = leads.filter(l => l.address && !l.addrKey);
        keysBtn.disabled = true;
        let done = 0;
        for (const l of todo) {
          l.addrKey = addrKey(l.address);
          if (await upsertLead(l)) done++;
        }
        keysBtn.disabled = false;
        keysBtn.textContent = 'Saved ' + done;
        toast('Address keys written for ' + done + ' record(s)');
      });
    }
  }

  function exportLeadsCSV() {
    if (!leads.length) { toast('No leads to export yet'); return; }
    const cols = ['dealId','address','source','status','dealOutcome','areaVerdict','offerType','isNewDev','isFixFlip',
      'contactName','contactEmail','arv','rehab','offer','offerSentDate','followUpDate','followUpTrack',
      'followUpStage','decidedBy','decidedOn','notes','dateAdded','lastUpdated'];
    const escCsv = (v) => {
      const s = v === null || v === undefined ? '' : String(v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const rows = [cols.join(',')];
    leads.forEach(l => rows.push(cols.map(c => escCsv(l[c])).join(',')));
    const csv = rows.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `deal-ledger-leads-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  searchEl.addEventListener('input', render);
  statusFilterEl.addEventListener('change', render);
  sourceFilterEl.addEventListener('change', render);
  catFilterEl.addEventListener('change', render);
  recordsFilterEl.addEventListener('change', render);
  sortEl.addEventListener('change', render);

  // ============================================================
  //  Access — the email/password sign-in gate was removed 2026-09-17
  //  (team decision): the ledger opens directly for anyone with the
  //  link. What the page can read and write is now exactly what the
  //  Supabase row-level-security policies grant the anon/publishable
  //  key. If those policies still require an authenticated user, the
  //  list loads empty and the note below says so.
  // ============================================================
  let appStarted = false;

  async function startApp() {
    root.style.display = 'block';
    if (appStarted) return;
    appStarted = true;
    const noteEl = document.getElementById('dl-team-note-text');
    try {
      await loadTemplates();
      await loadLeads();
    } catch (e) {
      console.error('startApp failed', e);
    }
    // Supabase RLS does not error on a forbidden read — it returns zero rows. The team
    // list has never been empty, so an empty result almost certainly means the anon
    // policies are not in place yet; say so instead of showing an empty pipeline.
    if (noteEl && (loadFailed || !leads.length)) {
      noteEl.textContent = loadFailed
        ? 'Could not load the shared list — the database refused the request. Ask Brian to update the Supabase policies.'
        : 'No leads came back — if the team list is missing, the database is still refusing anonymous access. Ask Brian to update the Supabase policies.';
    }
  }

  // Load Google Maps (for geocoding) if a key is configured — safe no-op otherwise.
  initMaps();

  startApp();
})();
</script>
</body>
</html>
