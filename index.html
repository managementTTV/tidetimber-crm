<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deal Ledger — Lead Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  html, body { margin: 0; padding: 0; }
  :root {
    --ink: #1C2B39;
    --ink-soft: #46586A;
    --paper: #F1EDE4;
    --paper-raised: #FAF8F2;
    --line: #CFC6B3;
    --line-strong: #B6AA90;
    --brass: #A8823D;
    --brass-dark: #8A6A2E;
    --active: #3F6B4F;
    --active-bg: #E3ECE4;
    --pending: #B8863B;
    --pending-bg: #F3E9D6;
    --sold: #8B4A3D;
    --sold-bg: #EFE1DC;
    --off: #6B6459;
    --off-bg: #E7E3D8;
    --escalate: #6B4E8E;
    --escalate-bg: #E9E2F0;
    --dev: #2F5A82;
    --dev-bg: #DCE6F0;
    --flip: #8A6A2E;
    --flip-bg: #EFE6CF;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  #deal-root {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }

  .dl-wrap { max-width: 1220px; margin: 0 auto; padding: 28px 24px 80px; }

  .dl-header {
    display: flex; justify-content: space-between; align-items: flex-end;
    flex-wrap: wrap; gap: 16px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 18px; margin-bottom: 22px;
  }
  .dl-title-block .eyebrow {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--brass-dark);
    margin-bottom: 6px;
  }
  .dl-title-block h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 34px; margin: 0; letter-spacing: -0.01em; }
  .dl-team-note {
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 6px;
  }
  .dl-team-note .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--active); display: inline-block; }

  .dl-stats {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px;
    background: var(--line); border: 1px solid var(--line); margin-bottom: 26px;
  }
  .dl-stat { background: var(--paper-raised); padding: 12px 14px; }
  .dl-stat .num { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; }
  .dl-stat .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-soft); margin-top: 2px; }
  .dl-stat.warn .num { color: var(--escalate); }

  .dl-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .dl-search {
    flex: 1; min-width: 180px; font-family: 'Inter', sans-serif; font-size: 13.5px;
    padding: 9px 12px; border: 1px solid var(--line-strong); background: var(--paper-raised);
    border-radius: var(--radius); color: var(--ink);
  }
  .dl-search:focus, select:focus, textarea:focus, input:focus { outline: 2px solid var(--brass); outline-offset: 1px; }
  .dl-select {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 8px 10px;
    border: 1px solid var(--line-strong); background: var(--paper-raised); color: var(--ink-soft);
    border-radius: var(--radius); cursor: pointer;
  }
  .dl-new-btn {
    margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 600;
    padding: 10px 16px; background: var(--ink); color: var(--paper); border: none;
    border-radius: var(--radius); cursor: pointer; letter-spacing: 0.02em;
  }
  .dl-new-btn:hover { background: var(--brass-dark); }

  .dl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

  .dl-card {
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; position: relative; cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .dl-card:hover { border-color: var(--ink); transform: translateY(-1px); }

  .dl-topline { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .dl-dealid { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--ink-soft); letter-spacing: 0.02em; }
  .dl-stamp {
    font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 2px;
    transform: rotate(1.5deg); white-space: nowrap;
  }
  .stamp-active { background: var(--active-bg); color: var(--active); }
  .stamp-pending { background: var(--pending-bg); color: var(--pending); }
  .stamp-sold { background: var(--sold-bg); color: var(--sold); }
  .stamp-off { background: var(--off-bg); color: var(--off); }
  .stamp-escalate { background: var(--escalate-bg); color: var(--escalate); }

  .dl-card .addr { font-family: 'Fraunces', serif; font-size: 16.5px; font-weight: 500; line-height: 1.3; margin-bottom: 8px; }

  .dl-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .dl-tag { font-family: 'IBM Plex Mono', monospace; font-size: 10px; padding: 2px 7px; border-radius: 2px; text-transform: uppercase; letter-spacing: 0.03em; }
  .tag-dev { background: var(--dev-bg); color: var(--dev); }
  .tag-flip { background: var(--flip-bg); color: var(--flip); }
  .tag-source { background: var(--off-bg); color: var(--off); }
  .tag-flags { background: var(--sold-bg); color: var(--sold); }

  .dl-card .row {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft);
    border-top: 1px dashed var(--line-strong); padding-top: 9px; margin-top: 2px;
    display: flex; justify-content: space-between;
  }
  .dl-card .contact { font-size: 11.5px; color: var(--ink-soft); margin-top: 6px; }

  .dl-empty { text-align: center; padding: 70px 20px; color: var(--ink-soft); border: 1px dashed var(--line-strong); border-radius: var(--radius); }
  .dl-empty h3 { font-family: 'Fraunces', serif; font-size: 20px; color: var(--ink); margin-bottom: 6px; }
  .dl-loading { text-align: center; padding: 60px; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; font-size: 13px; }

  .dl-overlay {
    position: fixed; inset: 0; background: rgba(28,43,57,0.55);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto; z-index: 50;
  }
  .dl-modal {
    background: var(--paper-raised); border: 1px solid var(--ink); border-radius: var(--radius);
    width: 100%; max-width: 640px; padding: 26px 26px 22px;
  }
  .dl-modal h2 { font-family: 'Fraunces', serif; font-size: 21px; margin: 0 0 4px; }
  .dl-modal .subid { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); margin-bottom: 16px; }

  .dl-field { margin-bottom: 13px; }
  .dl-field label { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-soft); margin-bottom: 4px; }
  .dl-field input, .dl-field select, .dl-field textarea {
    width: 100%; font-family: 'Inter', sans-serif; font-size: 13.5px; padding: 8px 10px;
    border: 1px solid var(--line-strong); background: #fff; border-radius: var(--radius); color: var(--ink);
  }
  .dl-field textarea { resize: vertical; min-height: 60px; }
  .dl-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .dl-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  .dl-checkrow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .dl-checkrow input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--ink); flex-shrink: 0; }
  .dl-checkrow label { font-size: 13px; color: var(--ink); margin: 0; text-transform: none; letter-spacing: normal; font-family: 'Inter', sans-serif; }

  .dl-cat-toggle { display: flex; gap: 16px; padding: 10px 0 4px; }
  .dl-cat-toggle .dl-checkrow { margin-bottom: 0; }

  .dl-dd-section {
    border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px;
    background: var(--paper); margin-top: 6px; margin-bottom: 16px;
  }

  .dl-dash-modal { max-width: 640px; }
  .dl-dash-topstats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 22px; }
  .dl-dash-stat { background: var(--paper-raised); padding: 12px 8px; text-align: center; }
  .dl-dash-stat .num { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; color: var(--brass-dark); }
  .dl-dash-stat .lbl { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); margin-top: 3px; }
  .dl-dash-section-title { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-soft); margin: 20px 0 10px; }
  .dl-dash-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
  .dl-dash-row .dl-dash-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); width: 92px; flex-shrink: 0; text-align: right; }
  .dl-dash-row .dl-dash-track { flex: 1; background: var(--paper); border: 1px solid var(--line); border-radius: 2px; height: 18px; position: relative; overflow: hidden; }
  .dl-dash-row .dl-dash-bar { background: var(--brass); height: 100%; border-radius: 1px 0 0 1px; transition: width 0.2s ease; }
  .dl-dash-row .dl-dash-count { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; font-weight: 600; width: 22px; text-align: right; flex-shrink: 0; }
  .dl-dash-empty { color: var(--ink-soft); font-size: 12.5px; padding: 8px 0; }
  .dl-dash-lookup-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .dl-dash-lookup-row label { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); width: 58px; flex-shrink: 0; }
  .dl-dash-lookup-row select, .dl-dash-lookup-row input[type=date] {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 7px 9px;
    border: 1px solid var(--line-strong); background: #fff; color: var(--ink); border-radius: var(--radius);
  }
  .dl-dash-lookup-row select { flex: 1; min-width: 140px; }
  .dl-dash-lookup-row .dl-dash-sep { font-size: 11.5px; color: var(--ink-soft); }
  .dl-dash-result-badge {
    font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 16px; color: var(--brass-dark);
    margin-left: auto; min-width: 34px; text-align: right;
  }
  @media (max-width: 760px) {
    .dl-dash-topstats { grid-template-columns: repeat(3, 1fr); }
    .dl-dash-topstats .dl-dash-stat:nth-child(4), .dl-dash-topstats .dl-dash-stat:nth-child(5) { grid-column: span 1; }
    .dl-dash-lookup-row label { width: auto; }
    .dl-dash-lookup-row select { min-width: 100%; }
    .dl-dash-result-badge { margin-left: 0; }
  }
  .dl-dd-section .dd-title {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--sold); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
  }
  .dd-count { background: var(--sold-bg); color: var(--sold); padding: 1px 7px; border-radius: 2px; font-size: 10.5px; }

  .dl-modal-actions {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line);
  }
  .dl-btn { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 600; padding: 9px 16px; border-radius: var(--radius); cursor: pointer; border: 1px solid transparent; }
  .dl-btn-primary { background: var(--ink); color: var(--paper); }
  .dl-btn-primary:hover { background: var(--brass-dark); }
  .dl-btn-ghost { background: transparent; color: var(--ink-soft); border-color: var(--line-strong); }
  .dl-btn-ghost:hover { border-color: var(--ink); color: var(--ink); }
  .dl-btn-danger { background: transparent; color: var(--sold); border-color: var(--sold); }
  .dl-btn-danger:hover { background: var(--sold-bg); }

  .dl-detail-body .notes { font-size: 13.5px; line-height: 1.55; color: var(--ink); background: var(--paper); padding: 12px; border-radius: var(--radius); border: 1px solid var(--line); white-space: pre-wrap; margin-top: 6px; }
  .dl-detail-body .meta-row { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-soft); margin-top: 14px; font-family: 'IBM Plex Mono', monospace; }
  .dl-detail-body .numbers { display: flex; gap: 20px; font-family: 'IBM Plex Mono', monospace; font-size: 15px; margin: 10px 0 14px; }
  .dl-detail-body .numbers .n-lbl { font-size: 10px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 2px; }
  .dl-detail-body .dd-list { margin-top: 6px; }
  .dl-detail-body .dd-item { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 4px 0; }
  .dl-detail-body .dd-item.flagged { color: var(--sold); font-weight: 600; }
  .dl-detail-body .dd-item .mark { width: 14px; }

  .dl-toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px; padding: 10px 18px; border-radius: var(--radius); z-index: 100;
    opacity: 0; transition: opacity 0.25s ease;
  }
  .dl-toast.show { opacity: 1; }

  @media (max-width: 760px) {
    .dl-stats { grid-template-columns: repeat(3, 1fr); }
    .dl-row2, .dl-row3 { grid-template-columns: 1fr; }
  }

  /* --- Follow-up queue --- */
  .dl-fu-section {
    border: 1px solid var(--line-strong); border-radius: var(--radius);
    background: var(--paper-raised); margin-bottom: 26px; overflow: hidden;
  }
  .dl-fu-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--paper-raised), var(--paper));
  }
  .dl-fu-head h2 {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 16.5px; margin: 0;
    display: flex; align-items: center; gap: 8px;
  }
  .dl-fu-head .fu-count {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600;
    background: var(--escalate-bg); color: var(--escalate); padding: 2px 8px; border-radius: 10px;
  }
  .dl-fu-empty { padding: 22px 16px; text-align: center; color: var(--ink-soft); font-size: 13px; }
  .dl-fu-list { display: flex; flex-direction: column; }
  .dl-fu-row {
    display: flex; align-items: center; gap: 14px; padding: 12px 16px;
    border-bottom: 1px dashed var(--line);
  }
  .dl-fu-row:last-child { border-bottom: none; }
  .dl-fu-row.overdue { background: var(--sold-bg); }
  .dl-fu-main { flex: 1; min-width: 0; }
  .dl-fu-addr { font-family: 'Fraunces', serif; font-size: 14.5px; font-weight: 500; margin-bottom: 3px; }
  .dl-fu-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .dl-fu-badge {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.03em; padding: 2px 7px; border-radius: 2px;
  }
  .badge-followup { background: var(--active-bg); color: var(--active); }
  .badge-rejected { background: var(--sold-bg); color: var(--sold); }
  .badge-ghosted { background: var(--off-bg); color: var(--off); }
  .dl-fu-overdue-tag { color: var(--sold); font-weight: 600; }
  .dl-fu-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .dl-fu-stage-select {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 6px 8px;
    border: 1px solid var(--line-strong); background: #fff; border-radius: var(--radius); color: var(--ink-soft);
    cursor: pointer; max-width: 150px;
  }
  .dl-btn-sm { font-size: 11.5px; padding: 7px 11px; }
  /* Editable due date inside the follow-up queue (Pat, Sept 2026). */
  .dl-fu-date-wrap {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--ink-soft);
  }
  .dl-fu-date {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 5px 7px;
    border: 1px solid var(--line-strong); background: #fff; border-radius: var(--radius); color: var(--ink);
  }
  .dl-fu-row.overdue .dl-fu-date { border-color: var(--sold); }

  /* Copy-address button (Pat request): small inline chip next to any address. */
  .dl-copy-addr {
    display: inline-flex; align-items: center; justify-content: center;
    margin-left: 6px; padding: 1px 6px; border-radius: 5px; cursor: pointer;
    font-size: 11px; line-height: 1.5; vertical-align: middle;
    background: transparent; color: var(--ink-soft);
    border: 1px solid var(--line-strong);
  }
  .dl-copy-addr:hover { color: var(--ink); border-color: var(--ink); }

  /* Duplicate-address warning under the address field (Pat request). */
  .dl-dup-warn {
    margin-top: 6px; padding: 8px 10px; border-radius: 6px; font-size: 12px;
    color: var(--ink); border: 1px solid #B8863B; background: rgba(184,134,59,0.10);
  }
  .dl-dup-warn.dup-exact { border-color: #8B4A3D; background: rgba(139,74,61,0.12); }
  .dl-dup-warn .dw-title { font-weight: 600; margin-bottom: 3px; }

  /* Duplicate report modal */
  .dl-dupe-modal { max-width: 900px; }
  .dl-dupe-pair { border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
  .dl-dupe-pair .pair-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
  .dl-dupe-pair .pair-kind { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--brass-dark); }
  .dl-dupe-rec { font-size: 12.5px; padding: 7px 9px; border-radius: 5px; background: var(--off-bg); margin-bottom: 6px; }
  .dl-dupe-rec.is-keeper { background: rgba(63,107,79,0.10); border: 1px solid #3F6B4F; }
  .dl-dupe-rec .rec-addr { font-weight: 600; }
  .dl-dupe-rec .rec-meta { color: var(--ink-soft); font-size: 11.5px; margin-top: 2px; }
  .dl-dupe-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
  .dl-dupe-note { font-size: 11.5px; color: var(--ink-soft); margin-top: 6px; }
  .tag-retired { background: #8B4A3D; color: #fff; }
  .dl-dup-warn ul { margin: 3px 0 0 16px; padding: 0; }
  .dl-dup-warn li { margin: 1px 0; }
  .dl-btn-brass { background: var(--brass); color: #fff; }
  .dl-btn-brass:hover { background: var(--brass-dark); }

  /* --- Email prep modal --- */
  .dl-email-modal { max-width: 640px; }
  .dl-email-meta { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-soft); margin-bottom: 14px; display: flex; flex-direction: column; gap: 3px; }
  .dl-email-field { margin-bottom: 12px; }
  .dl-email-field .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin-bottom: 4px; }
  .dl-email-subject { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; padding: 9px 11px; background: #fff; border: 1px solid var(--line-strong); border-radius: var(--radius); }
  .dl-email-body {
    font-family: 'Inter', sans-serif; font-size: 13.5px; line-height: 1.6; white-space: pre-wrap;
    padding: 12px 13px; background: #fff; border: 1px solid var(--line-strong); border-radius: var(--radius);
    max-height: 320px; overflow-y: auto;
  }

  /* --- Template manager --- */
  .dl-tpl-modal { max-width: 720px; }
  .dl-tpl-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .dl-tpl-tab {
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; font-weight: 600; padding: 7px 12px;
    border: 1px solid var(--line-strong); background: var(--paper); color: var(--ink-soft);
    border-radius: var(--radius); cursor: pointer;
  }
  .dl-tpl-tab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .dl-tpl-stage-list { max-height: 460px; overflow-y: auto; padding-right: 4px; }
  .dl-tpl-stage-block { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; background: var(--paper); }
  .dl-tpl-stage-block .stage-lbl { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; color: var(--brass-dark); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
  .dl-tpl-hint { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 14px; line-height: 1.5; }
  .dl-merge-tags { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--ink-soft); }
  .dl-merge-tags code { background: var(--off-bg); padding: 1px 5px; border-radius: 2px; }

  /* --- Login gate --- */

  /* --- Area read (verdict + reasons) --- */
  .dl-verdict-toggle { display: flex; gap: 8px; margin-bottom: 10px; }
  .dl-verdict-btn {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; padding: 7px 14px;
    border: 1px solid var(--line-strong); background: var(--paper); color: var(--ink-soft);
    border-radius: var(--radius); cursor: pointer;
  }
  .dl-verdict-btn.active { background: var(--vc); color: #fff; border-color: var(--vc); }
  .dl-area-reasons { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; }
  @media (max-width: 620px) { .dl-area-reasons { grid-template-columns: 1fr; } }

  /* --- Map modal --- */
  .dl-map-modal { max-width: 1100px; width: 100%; padding: 20px; }
  .dl-map-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .dl-map-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .dl-map-seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
  .dl-map-seg button {
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; font-weight: 600; padding: 6px 11px;
    background: var(--paper); color: var(--ink-soft); border: none; cursor: pointer;
  }
  .dl-map-seg button.active { background: var(--ink); color: var(--paper); }
  .dl-map-canvas { width: 100%; height: 62vh; min-height: 380px; border: 1px solid var(--line-strong); border-radius: var(--radius); }
  .dl-map-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }
  .dl-map-legend .lg { display: inline-flex; align-items: center; gap: 5px; }
  .dl-map-legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dl-map-note { font-size: 11.5px; color: var(--ink-soft); margin-top: 8px; }
  .dl-iw { font-family: 'Inter', sans-serif; max-width: 240px; color: #1C2B39; }
  .dl-iw .iw-addr { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .dl-iw .iw-sub { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #46586A; margin-bottom: 6px; }
  .dl-iw .iw-row { font-size: 12px; margin: 2px 0; }
  .dl-iw .iw-reasons { font-size: 11px; color: #8B4A3D; margin-top: 4px; }
  .dl-iw .iw-open { margin-top: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; font-weight: 600; padding: 6px 12px; background: #1C2B39; color: #F1EDE4; border: none; border-radius: 3px; cursor: pointer; }
</style>

<body>

  <div class="dl-wrap">

      <select id="dl-status-filter" class="dl-select"><option value="all">All statuses</option></select>

<div id="dl-toast" class="dl-toast"></div>

<script>
(function() {
  // ============================================================
  //  CONFIG — paste your own project values here.
  //  Supabase: Project Settings → API → Project URL + "anon public" key.
  //  Google Maps key is OPTIONAL — leave the placeholder and the app still
  //  works; fill it in to auto-geocode addresses for the future map layer.
  // ============================================================
  const SUPABASE_URL = 'https://jcnicrsdzyrosgldilns.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_8WEYiPA8lHudShHJF9IHhA_FtXw350j';
  const GOOGLE_MAPS_API_KEY = 'AIzaSyA8ttzVePEPBJKVBraPac0m6R9gbuOzsNU';   // domain-restricted to the Netlify site

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // --- Storage: ONE ROW PER LEAD (fixes the old whole-list overwrite bug) ---
  // Each save writes only the lead that changed. lat/lng are also mirrored
  // into real columns so a future map / geospatial query has them ready.
  async function fetchAllLeads() {
    const { data, error } = await sb
      .from('leads')
      .select('id, data')
      .order('created_at', { ascending: true });
    if (error) throw error;
    // The row id is the source of truth. Imported rows may not carry it inside
    // the JSON blob, so mirror it in or they can't be opened, edited or deleted.
    return (data || []).map(r => Object.assign({}, r.data, {
      id: (r.data && r.data.id) ? r.data.id : r.id
    }));
  }

  async function upsertLead(lead) {
    const { error } = await sb.from('leads').upsert(
      { id: lead.id, data: lead, lat: lead.lat ?? null, lng: lead.lng ?? null },
      { onConflict: 'id' }
    );
    if (error) console.error('upsertLead failed', error);
    return !error;
  }

  async function deleteLeadRow(id) {
    const { error } = await sb.from('leads').delete().eq('id', id);
    if (error) console.error('deleteLeadRow failed', error);
    return !error;
  }

  // --- Settings (email-template overrides) — single shared row ---
  async function settingsGet(key) {
    const { data, error } = await sb.from('settings').select('data').eq('key', key).maybeSingle();
    if (error) throw error;
    return data ? data.data : null;
  }

  async function settingsSet(key, value) {
    const { error } = await sb.from('settings').upsert({ key, data: value }, { onConflict: 'key' });
    if (error) console.error('settingsSet failed', error);
    return !error;
  }
  // --- end storage layer ---

  // --- Geocoding (map groundwork) ---
  // Best-effort: if a Google Maps key is set, we turn each lead's address into
  // lat/lng on save so the future map can drop a pin. No key (or a failed
  // lookup) just means the lead saves without coordinates — backfill later.
  let mapsReady = false;
  let geocoder = null;
  function initMaps() {
    if (!GOOGLE_MAPS_API_KEY || GOOGLE_MAPS_API_KEY.indexOf('YOUR-') === 0) return;
    window.__dlMapsReady = function () {
      try { geocoder = new google.maps.Geocoder(); mapsReady = true; }
      catch (e) { mapsReady = false; }
    };
    const s = document.createElement('script');
    s.src = 'https://maps.googleapis.com/maps/api/js?key=' + GOOGLE_MAPS_API_KEY + '&libraries=visualization&callback=__dlMapsReady&loading=async';
    s.async = true;
    document.head.appendChild(s);
  }
  function geocodeAddress(address) {
    return new Promise(function (resolve) {
      if (!mapsReady || !geocoder || !address) return resolve(null);
      geocoder.geocode({ address: address }, function (results, status) {
        if (status === 'OK' && results && results[0]) {
          const loc = results[0].geometry.location;
          resolve({ lat: loc.lat(), lng: loc.lng() });
        } else {
          resolve(null);
        }
      });
    });
  }

  const STORAGE_KEY = 'crm-leads';
  let leads = [];
  let loaded = false;

  const SOURCES = [
    { value: 'Wholesaler', prefix: 'WS' },
    { value: 'Wholesalers', prefix: 'WS' },
    { value: 'Inbound', prefix: 'IB' },
    { value: 'Outbound', prefix: 'OB' },
    { value: 'Off-Market', prefix: 'OM' },
    { value: 'Land', prefix: 'LD' },
    { value: 'Teardown', prefix: 'TD' },
    { value: 'Other', prefix: 'OT' },
  ];

  const STATUSES = [
    'New / Untouched',
    'For Underwriting',
    'Offer Sent',
    'Active Follow-Up',
    'Escalated – Awaiting Supervisor Review',
    'Qualified',
    'Off-Market',
    'Rejected',
    'Ghosted',
    'Dead',
    'Pass',
  ];

  // New-lead vocabularies (Pat #1, #9). NEW leads pick from these trimmed lists;
  // existing leads keep whatever value they already hold. The filter dropdowns
  // still use the full SOURCES/STATUSES lists, so legacy values stay searchable.
  const ACTIVE_SOURCES = ['Wholesaler', 'Inbound', 'Outbound'];               // #1: drop Wholesalers dup + Off-Market/Land/Teardown/Other
  const ACTIVE_STATUSES = STATUSES.filter(s => s !== 'For Underwriting');     // #9: drop "For Underwriting"

  // Build <option>s from an active list. If the record already holds a retired
  // value, keep it in the list (still selected) so editing never silently
  // reassigns it — "hide for new, keep old."
  function optionsPreserving(activeValues, current) {
    const vals = activeValues.slice();
    if (current && !vals.includes(current)) vals.unshift(current);
    return vals.map(v => `<option value="${escapeHtml(v)}" ${current === v ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('');
  }

  // ============================================================
  //  STATUS RULES -- the single source of truth for "status implies X".
  //  Every rule Pat has asked for lives here and nowhere else. Add the next
  //  one to this table, not to a UI handler.
  //
  //    Rejected   -> follow-up TRACK = Rejected, stage 1, DATE = today + Rejected cadence (14d)
  //    Ghosted    -> follow-up TRACK = Ghosted,  stage 1, DATE = today + Ghosted cadence  (14d)
  //                  (Sept 2026: Pat flagged that the date used to stay put, so a
  //                   rejected lead kept showing up on the daily cadence.)
  //    Offer Sent -> follow-up DATE  = tomorrow
  //    Escalated  -> follow-up DATE  = tomorrow
  //    Dead / Qualified / Off-Market / Pass -> follow-up DATE cleared
  //
  //  statusRuleChanges() returns ONLY the fields that should change, so the
  //  same logic drives the edit form (live, as you pick a status) and the save
  //  path (so a status set by an import or a future bulk edit gets the same
  //  treatment -- the old version only fired on a human using the form).
  // ============================================================
  const FU_CLEAR_STATUSES = ['Dead', 'Qualified', 'Off-Market', 'Pass'];
  const STATUS_ESCALATED = 'Escalated \u2013 Awaiting Supervisor Review';
  const STATUS_TO_TRACK = { 'Rejected': 'rejected', 'Ghosted': 'ghosted' };

  function tomorrowIso() {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    return d.toISOString().slice(0, 10);
  }

  function statusRuleChanges(status, current) {
    const out = {};
    const cur = current || {};
    const wantTrack = STATUS_TO_TRACK[status];
    if (wantTrack && (cur.followUpTrack || 'followup') !== wantTrack) {
      out.followUpTrack = wantTrack;
      out.followUpStage = 1;
      out.followUpDate = computeNextDate(wantTrack, 1); // same math as the stage picker
    }
    if (status === 'Offer Sent' || status === STATUS_ESCALATED) {
      out.followUpDate = tomorrowIso();
    } else if (FU_CLEAR_STATUSES.includes(status)) {
      out.followUpDate = '';
    }
    return out;
  }

  // Applies the rules to a lead in place. prevStatus guards hand-edits: if the
  // status did not change on this save, whatever the user typed into the date
  // field wins (Pat #4 explicitly wanted the auto-date to stay overridable).
  function applyStatusRules(lead, prevStatus) {
    if (prevStatus !== undefined && prevStatus === lead.status) return lead;
    return Object.assign(lead, statusRuleChanges(lead.status, lead));
  }

  const STATUS_STAMP = {
    'New / Untouched': 'stamp-off',
    'For Underwriting': 'stamp-pending',
    'Offer Sent': 'stamp-pending',
    'Active Follow-Up': 'stamp-active',
    'Escalated – Awaiting Supervisor Review': 'stamp-escalate',
    'Qualified': 'stamp-active',
    'Off-Market': 'stamp-off',
    'Rejected': 'stamp-sold',
    'Ghosted': 'stamp-sold',
    'Dead': 'stamp-sold',
    'Pass': 'stamp-off',
  };

  const DD_ITEMS = [
    { key: 'well', label: 'Well requirement (no access to municipal water)' },
    { key: 'septic', label: 'Septic requirement (no access to municipal sewer)' },
    { key: 'proximity', label: 'Proximity/adjacency to commercial, industrial, or apartment complex' },
    { key: 'legalRoad', label: 'No access to a legal road' },
    { key: 'fewComps', label: '0 to 1 solid comps available' },
    { key: 'luxuryComps', label: 'Comps are luxury-tier (ARV > $1,000,000)' },
    { key: 'zoning', label: 'Zoning restrictions' },
    { key: 'buffer', label: 'Post construction buffer' },
    { key: 'floodplain', label: 'Floodplains' },
    { key: 'floodZone', label: 'Flood Zone' },
    { key: 'easements', label: 'Easements' },
  ];

  // --- Area read (the "why we like / avoid this area" brain) ---
  // Stored per lead as areaVerdict ('like'|'neutral'|'avoid') + areaReasons {key:bool}.
  // These live in the JSON blob, so this list can grow/rename freely — no DB migration.
  const AREA_VERDICTS = [
    { key: 'like',    label: 'Like',    color: '#3F6B4F' },
    { key: 'neutral', label: 'Neutral', color: '#6B6459' },
    { key: 'avoid',   label: 'Avoid',   color: '#8B4A3D' },
  ];
  const AREA_VERDICT_COLOR = { like: '#3F6B4F', neutral: '#6B6459', avoid: '#8B4A3D', '': '#B6AA90' };
  // AREA reasons are DURABLE to the location. They aggregate across deals on the
  // same street/pocket and are the ONLY thing that feeds the map heat.
  const AREA_REASONS = [
    { key: 'badStreet',   label: 'Bad street / busy road' },
    { key: 'badArea',     label: 'Bad area / proximity (commercial, industrial, apartments)' },
    { key: 'sewer',       label: 'Sewer / septic issue' },
    { key: 'water',       label: 'Water / well issue' },
    { key: 'flood',       label: 'Floodplain / flood zone' },
    { key: 'zoning',      label: 'Zoning restrictions' },
    { key: 'entitlement', label: 'Entitlement / overlay / permit timeline (HDO, COA, rezoning)' },
    { key: 'compsThin',   label: 'Comps thin or none available' },
    { key: 'compsLow',    label: 'Comps will not support the price' },
    { key: 'outOfArea',   label: 'Outside buy box / too far' },
    { key: 'comps',       label: 'Poor comps (older records)' },
    // #8: net-new items merged up from the retired "Due Diligence — Red Flags" list.
    // (well/septic/proximity/fewComps/zoning/flood were already covered above.)
    { key: 'legalRoad',   label: 'No access to a legal road' },
    { key: 'luxuryComps', label: 'Comps are luxury-tier (ARV > $1,000,000)' },
    { key: 'buffer',      label: 'Post construction buffer' },
    { key: 'easements',   label: 'Easements' },
    { key: 'other',       label: 'Other' },
  ];

  // DEAL reasons are specific to THIS parcel or negotiation. Recorded and shown,
  // but never counted toward map heat -- a narrow lot says nothing about the street.
  const DEAL_REASONS = [
    { key: 'lotGeometry', label: 'Lot geometry (narrow, setbacks, subdivided, easement)' },
    { key: 'topo',        label: 'Topography / slope / grading' },
    { key: 'costAdd',     label: 'Cost add (crawl space, foundation, lot factor)' },
    { key: 'sellerTerms', label: 'Seller terms / price expectations' },
    { key: 'timing',      label: 'Timing (under contract, pending, timeline)' },
  ];

  // Point-in-time result for this deal -- a separate axis from areaVerdict.
  const DEAL_OUTCOMES = [
    { key: '',                        label: '-- not set --' },
    { key: 'pass',                    label: 'Pass' },
    { key: 'offer-sent',              label: 'Offer sent' },
    { key: 'wholesale-only',          label: 'Wholesale only' },
    { key: 'proceed-with-adjustment', label: 'Proceed with adjustment' },
  ];
  function dealOutcomeLabel(k) {
    const o = DEAL_OUTCOMES.find(x => x.key === (k || ''));
    return o ? o.label : '';
  }
  function dealReasonCount(l) {
    if (!l.dealReasons) return 0;
    return DEAL_REASONS.reduce((n, r) => n + (l.dealReasons[r.key] ? 1 : 0), 0);
  }
  function areaReasonCount(l) {
    if (!l.areaReasons) return 0;
    return AREA_REASONS.reduce((n, r) => n + (l.areaReasons[r.key] ? 1 : 0), 0);
  }

  // Pin colors for the map, keyed by lead status.
  const STATUS_COLOR = {
    'New / Untouched': '#6B6459',
    'For Underwriting': '#B8863B',
    'Offer Sent': '#B8863B',
    'Active Follow-Up': '#3F6B4F',
    'Escalated – Awaiting Supervisor Review': '#6B4E8E',
    'Qualified': '#3F6B4F',
    'Off-Market': '#6B6459',
    'Rejected': '#8B4A3D',
    'Ghosted': '#6E6A75',
    'Dead': '#8B4A3D',
    'Pass': '#6B6459',
  };

  // --- Follow-up tracks & cadence ---
  // "gaps[s-1]" = days to wait before a lead newly placed at stage s is due again.
  // --- Follow-up cadence ---
  // gaps[s-1] = days to wait before a lead newly placed at stage s is due again.
  const TRACKS = {
    followup: { key: 'followup', label: 'Follow-Up', badgeClass: 'badge-followup', maxStage: 7, gaps: [1,1,1,1,1,1,1] },              // daily
    rejected: { key: 'rejected', label: 'Rejected',   badgeClass: 'badge-rejected', maxStage: 9, gaps: [14,14,14,14,14,14,14,14,14] }, // every 2 weeks
    ghosted:  { key: 'ghosted',  label: 'Ghosted',    badgeClass: 'badge-ghosted',  maxStage: 9, gaps: [14,14,14,14,14,14,14,14,14] }, // every 2 weeks
  };
  const TRACK_ORDER = ['followup', 'rejected', 'ghosted'];

  const OFFER_TYPES = ['WS Basic', 'WS Far Off', 'OB Basic', 'OB Too Far Off', 'JV', 'Land Offer', 'Teardown Offer'];

  const TEMPLATES_KEY = 'crm-templates';
  let templates = {};
  let templatesLoaded = false;

  function tplKey(groupKey, stage) { return groupKey + ':' + stage; }

  // Template groups power both the Manage Templates modal and the email picker dropdown.
  const TEMPLATE_GROUPS = {
    offer: { label: 'Initial Offer', items: OFFER_TYPES.map(ot => ({ key: tplKey('offer', ot), stage: ot, label: ot })) },
    followup: { label: 'Follow-Up', items: Array.from({ length: TRACKS.followup.maxStage }, (_, i) => ({ key: tplKey('followup', i + 1), stage: i + 1, label: 'Day ' + (i + 1) })) },
    rejected: { label: 'Rejected', items: Array.from({ length: TRACKS.rejected.maxStage }, (_, i) => ({ key: tplKey('rejected', i + 1), stage: i + 1, label: 'Rejected Warm ' + (i + 1) })) },
    ghosted: { label: 'Ghosted', items: Array.from({ length: TRACKS.ghosted.maxStage }, (_, i) => ({ key: tplKey('ghosted', i + 1), stage: i + 1, label: 'Ghosted ' + (i + 1) })) },
    special: { label: 'Special', items: [{ key: tplKey('special', 'UW/Contingent'), stage: 'UW/Contingent', label: 'Back on market (UW/Contingent)' }] },
    // SMS templates are body-only (no subject). Prep Email shows them as a text
    // message with just "Copy text" -- the mail buttons are hidden.
    sms: { label: 'SMS', items: [{ key: tplKey('sms', 'Offer Sent Check-In'), stage: 'Offer Sent Check-In', label: 'Offer sent \u2014 did it come through?' }] },
  };
  const TEMPLATE_GROUP_ORDER = ['offer', 'followup', 'rejected', 'ghosted', 'special', 'sms'];
  function isSmsKey(key) { return String(key || '').indexOf('sms:') === 0; }

  // Verbatim from the user's template sheet.
  const DEFAULT_TEMPLATES = {
    'offer:WS Basic': {
      subject: 'Our offer on {{PropertyAddress}}',
      body: "Hey {{FirstName}},\n\nThanks for sending this over!\n\nAfter running the numbers, we’re coming in around {{OfferAmount}}.\n\nIf that works for you, let me know and we'll get things moving on our end.\n\nThanks,",
    },
    'offer:WS Far Off': {
      subject: 'Our offer on {{PropertyAddress}}',
      body: "Hey {{FirstName}},\n\nThanks for the info on {{PropertyAddress}}.\n\nWe’ve run the numbers and we’re coming in around {{OfferAmount}}. I know that's below where you need to be at this time, but feel free to reach out if the situation changes.\n\nThanks,",
    },
    'offer:OB Basic': {
      subject: 'Cash offer on {{PropertyAddress}}',
      body: "Hi {{FirstName}},\n\nI came across {{PropertyAddress}} and wanted to see if you’re open to a quick, cash offer.\n\nBased on our numbers, we’d be around {{OfferAmount}}, subject to a quick walkthrough. This would be a cash purchase, as-is, with a 10 to 14 day close, and we cover all standard closing costs.\n\nIf that’s something you’d consider, we'd be happy to take a closer look and firm things up.\n\nAppreciate your time, and I look forward to hearing your thoughts.\n\nThank you,",
    },
    'offer:OB Too Far Off': {
      subject: 'Cash offer on {{PropertyAddress}}',
      body: "Hi {{FirstName}},\n\nI came across {{PropertyAddress}} and wanted to see if you’re open to a quick, cash offer.\n\nBased on our numbers, we’d be around {{OfferAmount}}, subject to a quick walkthrough. This would be a cash purchase, as-is, with a 10 to 14 day close, and we cover all standard closing costs.\n\nI know that may be below asking, but if your seller is open to something in that range, I’d love to discuss further.\n\nThank you,",
    },

  function defaultTemplate(groupKey, stage) {
    return DEFAULT_TEMPLATES[tplKey(groupKey, stage)] || { subject: '', body: '' };
  }

  function buildDefaultTemplates() {
    return JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));
  }

  async function loadTemplates() {
    const defaults = buildDefaultTemplates();
    try {
      const saved = await settingsGet(TEMPLATES_KEY);
      templates = Object.assign({}, defaults, saved || {});
    } catch (e) {
      templates = defaults;
    }
    templatesLoaded = true;
  }

  async function saveTemplates() {
    try {
      return await settingsSet(TEMPLATES_KEY, templates);
    } catch (e) {
      return false;
    }
  }

  function computeNextDate(trackKey, stage, fromISO) {
    const track = TRACKS[trackKey];
    const idx = Math.min(Math.max(stage, 1), track.maxStage) - 1;
    const gap = track.gaps[idx] != null ? track.gaps[idx] : track.gaps[track.gaps.length - 1];
    const base = fromISO ? new Date(fromISO + 'T00:00:00') : new Date();
    base.setDate(base.getDate() + gap);
    return base.toISOString().slice(0, 10);
  }

  function fillMerge(str, l) {
    const first = (l.contactName || '').trim().split(/\s+/)[0] || 'there';
    const map = {
      '{{FirstName}}': first,
      '{{PropertyAddress}}': l.address || 'the property',
      '{{OfferAmount}}': (l.offer !== '' && l.offer != null) ? fmtMoney(l.offer) : 'our offer',
    };
    let out = str || '';
    Object.keys(map).forEach(k => { out = out.split(k).join(map[k]); });
    return out;
  }

  function defaultTemplateKeyForLead(l) {
    // #7: default the Prep Email to the OFFER template for fresh leads and for
    // leads whose status is "Offer Sent" (offer templates already live in Manage Templates).
    if ((l.status === 'New / Untouched' || l.status === 'Offer Sent') && l.offerType) return tplKey('offer', l.offerType);
    const tk = l.followUpTrack || 'followup';
    const stage = l.followUpStage || 1;
    return tplKey(tk, stage);
  }

  function renderEmailFromKey(key, l) {
    const tpl = templates[key] || DEFAULT_TEMPLATES[key] || { subject: '', body: '' };
    return { subject: fillMerge(tpl.subject, l), body: fillMerge(tpl.body, l) };
  }

  function getRenderedEmail(l) {
    return renderEmailFromKey(defaultTemplateKeyForLead(l), l);
  }

  function stageLabel(trackKey, stage) {
    return trackKey === 'followup' ? ('Day ' + stage) : ('Stage ' + stage);
  }

  function stageSelectOptionsHtml(l) {
    let html = '';
    TRACK_ORDER.forEach(tk => {
      const track = TRACKS[tk];
      html += `<optgroup label="${track.label}">`;
      for (let s = 1; s <= track.maxStage; s++) {
        const sel = ((l.followUpTrack || 'followup') === tk && (l.followUpStage || 1) === s) ? 'selected' : '';
        html += `<option value="${tk}:${s}" ${sel}>${track.label} — ${stageLabel(tk, s)}</option>`;
      }
      html += `</optgroup>`;
    });
    return html;
  }

  async function advanceFollowUp(id) {
    const l = leads.find(x => x.id === id);
    if (!l) return;
    const tk = l.followUpTrack || 'followup';
    const track = TRACKS[tk];
    const current = l.followUpStage || 1;
    const atMax = current >= track.maxStage;
    const next = Math.min(current + 1, track.maxStage);
    l.followUpTrack = tk;
    l.followUpStage = next;
    if (!atMax) l.followUpDate = computeNextDate(tk, next);
    l.lastUpdated = new Date().toISOString().slice(0, 10);
    render();
    const ok = await upsertLead(l);
    toast(atMax ? 'Already at final stage for this track' : `Marked done — now ${track.label} Day ${next}`);
    if (!ok) toast('Sync failed — check your connection and try again');
  }

  async function setFollowUpStage(id, trackKey, stage) {
    const l = leads.find(x => x.id === id);
    if (!l) return;
    l.followUpTrack = trackKey;
    l.followUpStage = stage;
    l.followUpDate = computeNextDate(trackKey, stage);
    l.lastUpdated = new Date().toISOString().slice(0, 10);
    render();
    const ok = await upsertLead(l);
    toast(ok ? 'Follow-up stage updated' : 'Sync failed — check your connection and try again');
  }

  function emailPickerOptionsHtml(l) {
    const defaultKey = defaultTemplateKeyForLead(l);
    let html = '';
    TEMPLATE_GROUP_ORDER.forEach(gk => {
      const group = TEMPLATE_GROUPS[gk];
      html += `<optgroup label="${group.label}">`;
      group.items.forEach(item => {
        html += `<option value="${item.key}" ${item.key === defaultKey ? 'selected' : ''}>${group.label} — ${item.label}</option>`;
      });
      html += `</optgroup>`;
    });
    return html;
  }

    const overlay = document.createElement('div');

        </div>
        <div class="dl-email-field" id="dl-email-subject-field">

          <div class="dl-email-subject" id="dl-email-subject">${escapeHtml(subject)}</div>
        </div>

          <div class="lbl" id="dl-email-body-lbl">Body</div>
          <div class="dl-email-body" id="dl-email-body">${escapeHtml(body)}</div>
        </div>
        <div class="dl-modal-actions">
          <button class="dl-btn dl-btn-ghost" id="dl-email-close">Close</button>
          <div style="display:flex; gap:8px;">
            <button class="dl-btn dl-btn-ghost" id="dl-email-copy">Copy text</button>
            <button class="dl-btn dl-btn-ghost" id="dl-email-open">Mail app</button>
            <button class="dl-btn dl-btn-primary" id="dl-email-gmail">Open in Gmail</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeOverlay(); });
    document.getElementById('dl-email-close').addEventListener('click', closeOverlay);
    // SMS templates have no subject and don't go through mail -- swap the modal
    // into "text message" mode (Copy text is the only action that makes sense).
    function applyMessageKind(key) {
      const sms = isSmsKey(key);
      document.getElementById('dl-email-title').textContent = sms ? 'Text message' : 'Follow-up email';
      document.getElementById('dl-email-subject-field').hidden = sms;
      document.getElementById('dl-email-body-lbl').textContent = sms ? 'Message' : 'Body';
      document.getElementById('dl-email-open').hidden = sms;
      document.getElementById('dl-email-gmail').hidden = sms;
    }
    applyMessageKind(defaultKey);
    document.getElementById('dl-email-tpl-picker').addEventListener('change', (e) => {
      const rendered = renderEmailFromKey(e.target.value, l);
      subject = rendered.subject;
      body = rendered.body;
      document.getElementById('dl-email-subject').textContent = subject;
      document.getElementById('dl-email-body').textContent = body;
      applyMessageKind(e.target.value);
    });
    document.getElementById('dl-email-copy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(body); // body only — subject stays out of the paste
        toast(isSmsKey(document.getElementById('dl-email-tpl-picker').value) ? 'Copied text message' : 'Copied email body');
      } catch (e) { toast('Copy failed — select the text manually'); }
    });
    // Gmail web compose (Pat request). Opens a Gmail draft in a new tab with the
    // recipient, subject and body prefilled. Uses the browser's signed-in default
    // Google account; the old mailto route is kept as the "Mail app" button.
    document.getElementById('dl-email-gmail').addEventListener('click', () => {
      const to = (l.contactEmail || '').trim();
      const url = 'https://mail.google.com/mail/?view=cm&fs=1&tf=1'
        + (to ? '&to=' + encodeURIComponent(to) : '')
        + '&su=' + encodeURIComponent(subject)
        + '&body=' + encodeURIComponent(body);
      window.open(url, '_blank', 'noopener');
      if (!to) toast('No email on file \u2014 Gmail opened with the message ready');
    });
    document.getElementById('dl-email-open').addEventListener('click', () => {
      const mailto = `mailto:${encodeURIComponent(l.contactEmail || '')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      window.open(mailto, '_blank');
    });
  }

  let tplActiveGroup = 'followup';
  function openTemplatesModal() {
    const overlay = document.createElement('div');
    overlay.className = 'dl-overlay';
    overlay.innerHTML = `
      <div class="dl-modal dl-tpl-modal">
        <h2>Email &amp; SMS templates</h2>
        <div class="dl-tpl-hint">
          Edit the subject and body for each one — these are pulled from your sheet as a starting point. SMS templates are body-only. Merge tags fill in automatically:
          <div class="dl-merge-tags">
            <code>{{FirstName}}</code> <code>{{PropertyAddress}}</code> <code>{{OfferAmount}}</code>
          </div>
        </div>
        <div class="dl-tpl-tabs" id="dl-tpl-tabs"></div>
        <div class="dl-tpl-stage-list" id="dl-tpl-stage-list"></div>
        <div class="dl-modal-actions">
          <button class="dl-btn dl-btn-ghost" id="dl-tpl-close">Close</button>
          <button class="dl-btn dl-btn-primary" id="dl-tpl-save">Save templates</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeOverlay(); });
    document.getElementById('dl-tpl-close').addEventListener('click', closeOverlay);

    const tabsEl = document.getElementById('dl-tpl-tabs');
    const listEl = document.getElementById('dl-tpl-stage-list');

    function renderTabs() {
      tabsEl.innerHTML = TEMPLATE_GROUP_ORDER.map(gk => `<button type="button" class="dl-tpl-tab ${gk === tplActiveGroup ? 'active' : ''}" data-gk="${gk}">${TEMPLATE_GROUPS[gk].label}</button>`).join('');
      tabsEl.querySelectorAll('.dl-tpl-tab').forEach(btn => {
        btn.addEventListener('click', () => { tplActiveGroup = btn.dataset.gk; renderTabs(); renderList(); });
      });
    }

    function renderList() {
      const group = TEMPLATE_GROUPS[tplActiveGroup];
      let html = '';
      group.items.forEach(item => {
        const tpl = templates[item.key] || defaultTemplate(tplActiveGroup, item.stage);
        html += `
          <div class="dl-tpl-stage-block">
            <div class="stage-lbl">${group.label} — ${item.label}</div>
            ${isSmsKey(item.key) ? '' : `<div class="dl-field"><label>Subject</label><input type="text" data-key="${item.key}" data-field="subject" value="${escapeHtml(tpl.subject)}" /></div>`}
            <div class="dl-field"><label>${isSmsKey(item.key) ? 'Message' : 'Body'}</label><textarea data-key="${item.key}" data-field="body" style="min-height:110px;">${escapeHtml(tpl.body)}</textarea></div>
          </div>`;
      });
      listEl.innerHTML = html;
    }

    renderTabs();
    renderList();

    document.getElementById('dl-tpl-save').addEventListener('click', async () => {
      document.querySelectorAll('#dl-tpl-stage-list [data-key]').forEach(el => {
        const key = el.dataset.key;
        const field = el.dataset.field;
        if (!templates[key]) templates[key] = { subject: '', body: '' };
        templates[key][field] = el.value;
      });
      const ok = await saveTemplates();
      toast(ok ? 'Templates saved' : 'Save failed — check your connection and try again.');
      if (ok) closeOverlay();
    });
  }

  function renderFollowUpQueue() {
    const fuEl = document.getElementById('dl-fu-section');
    if (!loaded) { fuEl.innerHTML = ''; return; }
    const today = new Date().toISOString().slice(0, 10);
    const due = leads.filter(l => l.followUpDate && l.followUpDate <= today)
      .sort((a, b) => new Date(a.followUpDate) - new Date(b.followUpDate));

    const head = `<div class="dl-fu-head"><h2>📋 Today's Follow-Ups <span class="fu-count">${due.length}</span></h2></div>`;

    if (due.length === 0) {
      fuEl.innerHTML = head + `<div class="dl-fu-empty">Nothing due today — you're caught up.</div>`;
      return;
    }

    const rows = due.map(l => {
      const tk = l.followUpTrack || 'followup';
      const track = TRACKS[tk];
      const stage = l.followUpStage || 1;
      const overdue = l.followUpDate < today;
      return `
        <div class="dl-fu-row ${overdue ? 'overdue' : ''}" data-id="${l.id}">
          <div class="dl-fu-main">
            <div class="dl-fu-addr">${escapeHtml(l.address || 'Untitled lead')}${copyAddrBtn(l.address)}</div>
            <div class="dl-fu-sub">
              <span class="dl-fu-badge ${track.badgeClass}">${track.label} · ${stageLabel(tk, stage)}</span>
              <span>${escapeHtml(l.contactName || 'No contact')}</span>
              ${overdue ? `<span class="dl-fu-overdue-tag">overdue since ${fmtDate(l.followUpDate)}</span>` : ''}
            </div>
          </div>
          <div class="dl-fu-actions">
            <label class="dl-fu-date-wrap" title="Next follow-up date \u2014 change it right here">
              <span>Due</span>
              <input type="date" class="dl-fu-date" data-action="set-date" data-id="${l.id}" value="${l.followUpDate || ''}" />
            </label>
            <select class="dl-fu-stage-select" data-action="set-stage" data-id="${l.id}">
              ${stageSelectOptionsHtml(l)}
            </select>
            <button class="dl-btn dl-btn-ghost dl-btn-sm" data-action="prep-email" data-id="${l.id}">Prep Email</button>
            <button class="dl-btn dl-btn-brass dl-btn-sm" data-action="mark-done" data-id="${l.id}">✓ Done → Next</button>
          </div>
        </div>`;
    }).join('');

    fuEl.innerHTML = head + `<div class="dl-fu-list">${rows}</div>`;

    fuEl.querySelectorAll('[data-action="prep-email"]').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); openEmailModal(btn.dataset.id); });
    });
    fuEl.querySelectorAll('[data-action="mark-done"]').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); advanceFollowUp(btn.dataset.id); });
    });
    fuEl.querySelectorAll('[data-action="set-stage"]').forEach(sel => {
      sel.addEventListener('click', (e) => e.stopPropagation());
      sel.addEventListener('change', (e) => {
        const [tk, stage] = sel.value.split(':');
        setFollowUpStage(sel.dataset.id, tk, Number(stage));
      });
    });
    // Pat (Sept 2026): the date is visible and editable right in the queue.
    fuEl.querySelectorAll('[data-action="set-date"]').forEach(inp => {
      inp.addEventListener('click', (e) => e.stopPropagation());
      inp.addEventListener('change', () => setFollowUpDate(inp.dataset.id, inp.value));
    });
  }

  // Hand-set the next follow-up date without touching track or stage. Moving it
  // into the future drops the row out of today's queue -- that is the point.
  async function setFollowUpDate(id, iso) {
    const l = leads.find(x => x.id === id);
    if (!l) return;
    l.followUpDate = iso || '';
    l.lastUpdated = new Date().toISOString().slice(0, 10);
    render();
    const ok = await upsertLead(l);
    if (!ok) { toast('Sync failed \u2014 check your connection and try again'); return; }
    toast(iso ? 'Follow-up moved to ' + fmtDate(iso) : 'Follow-up date cleared');
  }

  const contentEl = document.getElementById('dl-content');
  const statsEl = document.getElementById('dl-stats');
  const searchEl = document.getElementById('dl-search');

  const sourceFilterEl = document.getElementById('dl-source-filter');
  const catFilterEl = document.getElementById('dl-cat-filter');
  const recordsFilterEl = document.getElementById('dl-records-filter');

  const toastEl = document.getElementById('dl-toast');

  STATUSES.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; statusFilterEl.appendChild(o); });
  SOURCES.forEach(s => { const o = document.createElement('option'); o.value = s.value; o.textContent = s.value; sourceFilterEl.appendChild(o); });

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function fmtMoney(n) {
    if (n === '' || n === null || n === undefined) return '—';
    return '$' + Number(n).toLocaleString('en-US');
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return '—';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function flagCount(l) {
    if (!l.dd) return 0;
    return DD_ITEMS.reduce((n, item) => n + (l.dd[item.key] ? 1 : 0), 0);
  }

  function genDealId(sourceVal) {
    const src = SOURCES.find(s => s.value === sourceVal) || SOURCES[SOURCES.length - 1];
    const now = new Date();
    const stamp = now.getFullYear().toString().slice(2) +
      String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') +
      String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0') + String(now.getSeconds()).padStart(2,'0');
    return src.prefix + '-' + stamp;
  }

  let loadFailed = false;
  async function loadLeads() {
    try {
      const result = await fetchAllLeads();
      leads = result || [];
      loadFailed = false;
    } catch (e) {
      console.error('fetchAllLeads failed', e);
      leads = [];
      loadFailed = true;
    }
    leads = (leads || []).map(l => {
      const x = {
        followUpTrack: 'followup', followUpStage: 1, offerType: 'WS Basic',
        dealOutcome: '', dealReasons: {}, areaVerdict: '', areaReasons: {},
        ...l
      };
      // Normalized address key. Computed on load so every record has one even if
      // it was written by an import that never set it; persisted on any save and
      // by the "Save keys" action in the Duplicates report. An import can query
      // this field to check for an existing record BEFORE inserting.
      if (x.address) x.addrKey = addrKey(x.address);
      // Imported historical records arrive without pipeline fields -- fill them
      // in so they sort, filter and display like everything else.
      if (!x.status) {
        x.status = (x.dealOutcome === 'offer-sent' || x.dealOutcome === 'proceed-with-adjustment')
          ? 'Offer Sent' : (x.dealOutcome ? 'Pass' : 'New / Untouched');
      }
      if (!x.dealId) x.dealId = 'IM-' + String(x.id || '').slice(-6).toUpperCase();
      if (!x.dateAdded) x.dateAdded = x.decidedOn || '';
      if (!x.lastUpdated) x.lastUpdated = x.decidedOn || '';
      if (!x.dd) x.dd = {};
      return x;
    });
    loaded = true;
    render();
  }

  function renderStats() {
    // Reference records feed the map + area brain, never the pipeline counters.
    const pipe = leads.filter(l => (l.recordType || 'pipeline') !== 'reference');
    const total = pipe.length;
    const untouched = pipe.filter(l => l.status === 'New / Untouched').length;
    const escalated = pipe.filter(l => l.status === 'Escalated – Awaiting Supervisor Review').length;
    const qualified = pipe.filter(l => l.status === 'Qualified').length;
    const today = new Date().toISOString().slice(0,10);
    const followupToday = pipe.filter(l => l.followUpDate && l.followUpDate <= today).length;
    const pastDue = pipe.filter(l => l.followUpDate && l.followUpDate < today).length; // #3: overdue = date strictly before today

    // #9: "In Underwriting" tile removed alongside the retired status.
    statsEl.innerHTML = `
      <div class="dl-stat"><div class="num">${total}</div><div class="lbl">Total Leads</div></div>
      <div class="dl-stat"><div class="num">${untouched}</div><div class="lbl">New / Untouched</div></div>
      <div class="dl-stat warn"><div class="num">${escalated}</div><div class="lbl">Awaiting Supervisor</div></div>
      <div class="dl-stat"><div class="num">${qualified}</div><div class="lbl">Qualified</div></div>
      <div class="dl-stat"><div class="num">${followupToday}</div><div class="lbl">Follow-Ups Today</div></div>
      <div class="dl-stat${pastDue ? ' warn' : ''}"><div class="num">${pastDue}</div><div class="lbl">Past Due Follow-Up</div></div>
    `;
  }

  function getFiltered() {
    const q = searchEl.value.trim().toLowerCase();
    const statusF = statusFilterEl.value;
    const sourceF = sourceFilterEl.value;
    const catF = catFilterEl.value;
    const recF = recordsFilterEl.value;
    const sortV = sortEl.value;

    let list = leads.filter(l => {
      // Imported decision history is reference data for the area brain -- it
      // still feeds the map, but it stays out of the live pipeline by default.
      const kind = l.recordType || 'pipeline';
      if (recF !== 'all' && kind !== recF) return false;
      if (statusF !== 'all' && l.status !== statusF) return false;
      if (sourceF !== 'all' && l.source !== sourceF) return false;
      if (catF === 'dev' && !(l.isNewDev && !l.isFixFlip)) return false;
      if (catF === 'flip' && !(l.isFixFlip && !l.isNewDev)) return false;
      if (catF === 'both' && !(l.isNewDev && l.isFixFlip)) return false;
      if (!q) return true;
      const hay = `${l.address} ${l.contactName} ${l.contactEmail} ${l.dealId}`.toLowerCase();
      return hay.includes(q);
    });

    list.sort((a, b) => {
      if (sortV === 'date-asc') return new Date(a.dateAdded||0) - new Date(b.dateAdded||0);
      if (sortV === 'followup-asc') {
        if (!a.followUpDate && !b.followUpDate) return 0;
        if (!a.followUpDate) return 1;
        if (!b.followUpDate) return -1;
        return new Date(a.followUpDate) - new Date(b.followUpDate);
      }
      return new Date(b.dateAdded||0) - new Date(a.dateAdded||0);
    });

    return list;
  }

  function render() {
    renderStats();

    if (!loaded) { contentEl.innerHTML = '<div class="dl-loading">Loading leads…</div>'; return; }

    const list = getFiltered();

    if (leads.length === 0) {
      contentEl.innerHTML = `<div class="dl-empty"><h3>No leads yet</h3><p>Add your first lead to get the pipeline going.</p></div>`;
      return;
    }
    if (list.length === 0) {
      contentEl.innerHTML = `<div class="dl-empty"><h3>No matches</h3><p>Try a different search or filter.</p></div>`;
      return;
    }

    contentEl.innerHTML = `<div class="dl-grid">${list.map(cardHtml).join('')}</div>`;
    contentEl.querySelectorAll('.dl-card').forEach(card => {
      card.addEventListener('click', () => openDetail(card.dataset.id));

  // --- Clipboard helper ---------------------------------------------------
  async function copyText(text, okMsg) {
    if (!text) { toast('Nothing to copy'); return; }
    try {
      await navigator.clipboard.writeText(text);
      toast(okMsg || 'Copied');
      return;
    } catch (e) { /* clipboard API can be blocked -- fall through */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      toast(okMsg || 'Copied');
    } catch (e2) { toast('Copy failed -- select the text manually'); }
  }

  // --- Duplicate / near-duplicate address detection (Pat request) ----------
  // Pure front-end, no schema change: normalize both addresses to a comparable
  // form, then flag exact repeats hard and look-alikes softly.
  const ADDR_ABBR = {
    street:'st', str:'st', st:'st', road:'rd', rd:'rd', drive:'dr', dr:'dr', drv:'dr',
    lane:'ln', ln:'ln', avenue:'ave', ave:'ave', av:'ave', court:'ct', ct:'ct',
    boulevard:'blvd', blvd:'blvd', blv:'blvd', circle:'cir', cir:'cir', place:'pl', pl:'pl',
    terrace:'ter', ter:'ter', trail:'trl', trl:'trl', parkway:'pkwy', pkwy:'pkwy',
    highway:'hwy', hwy:'hwy', route:'rte', rte:'rte', rt:'rte', crossing:'xing', xing:'xing',
    north:'n', south:'s', east:'e', west:'w',
    northeast:'ne', northwest:'nw', southeast:'se', southwest:'sw',
    apartment:'apt', apt:'apt', unit:'unit', suite:'ste', ste:'ste', lot:'lot',
  };
  const ADDR_NOISE = ['nc','sc','usa','us','north','carolina','south'];
  function normAddress(v) {
    return String(v || '')
      .toLowerCase()
      .replace(/[.,#]/g, ' ')
      .replace(/[^a-z0-9\s-]/g, ' ')
      .split(/\s+/).filter(Boolean)
      .map(w => ADDR_ABBR[w] || w)
      .join(' ')
      .trim();
  }
  function addrKey(v) { return normAddress(v).replace(/[\s-]+/g, ''); }
  function addrHouseNum(v) { const m = normAddress(v).match(/^(\d+)/); return m ? m[1] : ''; }
  function addrTokens(v) { return normAddress(v).split(' ').filter(w => w && !ADDR_NOISE.includes(w)); }
  // Street-type words and directionals carry little identifying weight on their
  // own -- "Rd" matching "Rd" is not a signal, "Sardis" matching "Sardis" is.
  const ADDR_SUFFIX = new Set(['st','rd','dr','ln','ave','ct','blvd','cir','pl','ter','trl',
    'pkwy','hwy','rte','xing','way','loop','apt','unit','ste','lot','n','s','e','w','ne','nw','se','sw']);
  function addrNameTokens(v) {
    return addrTokens(v).filter(t => !/^\d+$/.test(t) && !ADDR_SUFFIX.has(t));
  }
  function sameStreet(a, b) {
    const A = addrNameTokens(a), B = addrNameTokens(b);
    if (!A.length || !B.length) return false;
    const setB = new Set(B);
    const shared = A.filter(t => setB.has(t)).length;
    return shared >= 1 && (shared / Math.min(A.length, B.length)) >= 0.6;
  }
  function addrOverlap(a, b) {
    const A = new Set(addrTokens(a)), B = new Set(addrTokens(b));
    if (!A.size || !B.size) return 0;
    let hit = 0;
    A.forEach(t => { if (B.has(t)) hit++; });
    return hit / Math.max(A.size, B.size);
  }
  // -> { exact: [lead], similar: [{lead, score}] }  (similar capped at 5)
  function findAddressMatches(address, excludeId) {
    const out = { exact: [], similar: [] };
    const key = addrKey(address);
    if (!key || key.length < 5) return out;
    const num = addrHouseNum(address);
    leads.forEach(l => {
      if (!l.address || (excludeId && l.id === excludeId)) return;
      if (l.retiredAsDuplicateOf) return; // already merged away -- not a live duplicate
      const lk = l.addrKey || addrKey(l.address);
      if (!lk) return;
      if (lk === key) { out.exact.push(l); return; }
      const score = addrOverlap(address, l.address);
      const sameNum = !!num && addrHouseNum(l.address) === num;
      const contains = lk.length > 5 && key.length > 5 && (lk.indexOf(key) === 0 || key.indexOf(lk) === 0);
      if (contains || (sameNum && score >= 0.5) || score >= 0.72) {
        out.similar.push({ lead: l, score, kind: 'near' });
      } else if (sameStreet(address, l.address)) {
        // Different house number on what looks like the same street -- not a
        // duplicate, but worth seeing before you add another record.
        out.similar.push({ lead: l, score, kind: 'street' });
      }
    });
    out.similar.sort((a, b) => (a.kind === b.kind ? b.score - a.score : (a.kind === 'near' ? -1 : 1)));
    out.similar = out.similar.slice(0, 5);
    return out;
  }
  function dupLineHtml(l) {
    return `<li>${escapeHtml(l.address)} <span style="opacity:.7;">(${escapeHtml(l.dealId || '')}${l.status ? ' \u00b7 ' + escapeHtml(l.status) : ''})</span></li>`;

        </div>

          <div class="dl-tags">

          </div>

            <div><span class="n-lbl">Rehab</span>${fmtMoney(l.rehab)}</div>
            <div><span class="n-lbl">Offer</span>${fmtMoney(l.offer)}</div>
          </div>
          ${areaHtml}
          ${dealHtml}
          ${ddHtml}
          <div class="dl-field"><label>Notes</label></div>
          <div class="notes">${escapeHtml(l.notes || 'No notes yet.')}</div>
          <div class="meta-row">
            <span>Contact: ${escapeHtml(l.contactName || '—')}${l.contactEmail ? ' (' + escapeHtml(l.contactEmail) + ')' : ''}</span>
            <span>Follow-up: ${l.followUpDate ? fmtDate(l.followUpDate) : '—'}</span>
          </div>

  function openForm(existing) {

      id: '', dealId: '', address: '', source: 'Wholesaler', status: 'New / Untouched',

  // Repeatable backfill: fills lat/lng for any lead that has an address but no
  // coordinates. Runs in the page so it uses the referrer-locked Maps key.
  // Safe to re-run -- it skips anything already geocoded.
  async function backfillGeocodes() {
    if (!mapsReady) { toast('Maps not loaded yet -- give it a second and retry'); return; }
    const todo = leads.filter(l => l.address && !(typeof l.lat === 'number' && !isNaN(l.lat)));
    if (!todo.length) { toast('Everything with an address already has coordinates'); return; }
    if (!confirm('Look up coordinates for ' + todo.length + ' lead(s)?')) return;
    const btn = document.getElementById('dl-geocode-btn');
    const label = btn.textContent;
    btn.disabled = true;
    let done = 0, missed = 0;
    const misses = [];
    for (const l of todo) {
      btn.textContent = 'Geocoding ' + (done + missed + 1) + '/' + todo.length;
      // Most imported addresses are street-only. Bias to NC so a bare street
      // name doesn't match an identically-named road in another state.
      const q = /\b(NC|SC|North Carolina|South Carolina)\b/i.test(l.address)
        ? l.address : (l.address + ', NC');
      try {
        const geo = await geocodeAddress(q);
        if (geo) { l.lat = geo.lat; l.lng = geo.lng; await upsertLead(l); done++; }
        else { missed++; misses.push(l.address); }
      } catch (e) { missed++; misses.push(l.address); }
      await new Promise(r => setTimeout(r, 120));
    }
    btn.disabled = false;
    btn.textContent = label;
    render();
    if (misses.length) console.log('Could not geocode:', misses);
    toast('Geocoded ' + done + (missed ? ' -- ' + missed + ' failed (see console)' : ''));
  }

  function isoDate(d) { return d.toISOString().slice(0, 10); }

  // Monday-start week key, labeled by the week's start date
  function weekKeyOf(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const day = (d.getDay() + 6) % 7; // 0 = Monday
    d.setDate(d.getDate() - day);
    return isoDate(d);
  }
  function monthKeyOf(dateStr) { return dateStr.slice(0, 7); } // YYYY-MM

  function offersSentDates() {
    return leads.map(l => l.offerSentDate).filter(Boolean);
  }

  function countsByWeek(numWeeks) {
    const dates = offersSentDates();
    const buckets = [];
    const today = new Date();
    for (let i = numWeeks - 1; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i * 7);
      const key = weekKeyOf(isoDate(d));
      buckets.push({ key, count: 0 });
    }
    dates.forEach(ds => {
      const key = weekKeyOf(ds);
      const b = buckets.find(x => x.key === key);
      if (b) b.count++;
    });
    return buckets;
  }

  function countsByMonth(numMonths) {
    const dates = offersSentDates();
    const buckets = [];
    const today = new Date();
    for (let i = numMonths - 1; i >= 0; i--) {
      const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      buckets.push({ key, count: 0 });
    }
    dates.forEach(ds => {
      const key = monthKeyOf(ds);
      const b = buckets.find(x => x.key === key);
      if (b) b.count++;
    });
    return buckets;
  }

  function formatWeekLabel(key) {
    const d = new Date(key + 'T00:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
  function formatMonthLabel(key) {
    const [y, m] = key.split('-');
    const d = new Date(Number(y), Number(m) - 1, 1);
    return d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
  }

  function shiftDate(d, days) { const nd = new Date(d); nd.setDate(nd.getDate() + days); return nd; }

  function buildWeekOptions(numWeeks) {
    const out = [];
    const seen = new Set();
    for (let i = 0; i < numWeeks; i++) {
      const key = weekKeyOf(isoDate(shiftDate(new Date(), -i * 7)));
      if (!seen.has(key)) { seen.add(key); out.push(key); }
    }
    return out;
  }

  function weekRangeLabel(key) {
    const start = new Date(key + 'T00:00:00');
    const end = shiftDate(start, 6);
    const fmt = (d) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    return `${fmt(start)} – ${fmt(end)}, ${end.getFullYear()}`;
  }

  function buildMonthOptions(numMonths) {
    const out = [];
    const today = new Date();
    for (let i = 0; i < numMonths; i++) {
      const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
      out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
    }
    return out;
  }

  function monthRangeLabel(key) {
    const [y, m] = key.split('-');
    const d = new Date(Number(y), Number(m) - 1, 1);
    return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  }

  function countForWeek(key) { return offersSentDates().filter(d => weekKeyOf(d) === key).length; }
  function countForMonth(key) { return offersSentDates().filter(d => monthKeyOf(d) === key).length; }
  function countForRange(fromStr, toStr) {
    if (!fromStr || !toStr) return null;
    const lo = fromStr <= toStr ? fromStr : toStr;
    const hi = fromStr <= toStr ? toStr : fromStr;
    return offersSentDates().filter(d => d >= lo && d <= hi).length;
  }

  function barRows(buckets, labelFn) {
    const max = Math.max(1, ...buckets.map(b => b.count));
    return buckets.map(b => `
      <div class="dl-dash-row">
        <span class="dl-dash-label">${labelFn(b.key)}</span>
        <span class="dl-dash-track"><span class="dl-dash-bar" style="width:${(b.count / max) * 100}%;"></span></span>
        <span class="dl-dash-count">${b.count}</span>
      </div>`).join('');
  }
